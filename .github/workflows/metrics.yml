# Regenerates the contribution skyline and languages chart in assets/ (see scripts/build_cards.py).
# Reads public data only, so the built-in Actions token is all it needs.
name: Profile cards
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build charts
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: jakerothstein
        run: python3 scripts/build_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(profile): refresh cards [skip ci]"
            git push
          fi
