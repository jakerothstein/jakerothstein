# Profile metrics, generated by https://github.com/lowlighter/metrics
#
# Token: uses the METRICS_PAT secret if present, otherwise falls back to the
# built-in Actions token (public data only). For private contributions and
# the full stats, create a classic PAT with `repo` + `read:user` scopes and run:
#   gh secret set METRICS_PAT --repo jakerothstein/jakerothstein
# (The old METRICS_TOKEN secret expired in July 2026 and is no longer used.)
name: Metrics
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

env:
  METRICS_TOKEN: ${{ secrets.METRICS_PAT || github.token }}

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Profile card: header, activity, community, repositories ──────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.base.svg
          template: classic
          base: header, activity, community, repositories
          base_indepth: no
          config_timezone: America/Los_Angeles
          config_padding: 8%
          config_display: large
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update profile card [Skip GitHub Action]"

      # ── Languages ───────────────────────────────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.languages.svg
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 8%
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, scss, tex, makefile, shell, dockerfile
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update languages [Skip GitHub Action]"

      # ── Coding habits (commit hours / days) ─────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.habits.svg
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 8%
          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update habits [Skip GitHub Action]"

      # ── Isometric commit calendar (full year) ───────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.isocalendar.svg
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 8%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update isocalendar [Skip GitHub Action]"

      # ── Achievements ────────────────────────────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.achievements.svg
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 8%
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update achievements [Skip GitHub Action]"

      # ── Recent activity (public only) ───────────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: jakerothstein
          filename: assets/metrics.activity.svg
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 8%
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: push, pr, issue, release, star
          retries: 2
          retries_delay: 120
          committer_message: "chore(metrics): update activity [Skip GitHub Action]"
