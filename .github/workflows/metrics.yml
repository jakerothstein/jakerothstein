# Regenerates the profile cards in assets/ (see scripts/build_cards.py).
#
# Token: uses the METRICS_PAT secret if present, otherwise the built-in Actions
# token (public data only). To also count private contributions, create a
# classic PAT with `repo` + `read:user` scopes and run:
#   gh secret set METRICS_PAT --repo jakerothstein/jakerothstein
# (The old METRICS_TOKEN secret expired in July 2026 and is no longer used.)
name: Profile cards
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build header + stat cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_PAT || github.token }}
          PROFILE_USER: jakerothstein
        run: |
          python3 scripts/build_header.py
          python3 scripts/build_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(profile): refresh cards [skip ci]"
            git push
          fi
